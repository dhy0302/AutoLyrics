# AutoLyrics 自动构建与发布（GitHub Actions）
#
# 作用：推送代码 → 自动编译 → 自动创建 GitHub Release → APK 直接挂在 Releases 页面上，
#       任何人都能像下载普通软件一样点击下载（无需登录 Actions、Artifacts）。
#
# ─────────────────────────────────────────────────────────────
# 【为什么只有一个 APK，不做 arm64/armv7 分包】
#
# 参考的 Lyrico 项目会拆成 arm64-v8a / armeabi-v7a 两个包，那是因为它带 native
# 库（.so），必须按 CPU 架构分发不同二进制。
#
# AutoLyrics 是纯 Kotlin + Jetpack Compose，无任何 native 库（见 BUILD.md 第 16 行
# 「无 native 库，全平台可装」），编译产物 dex 本身架构无关。因此：
#   · 分包不会减小体积（没有 .so 可拆）
#   · 反而会让 32 位老设备（armeabi-v7a）装不上
# 所以这里输出单个通用包，全平台（Android 8.0+）可装。
#
# 【关于签名与产物】
#
# 本仓库**不包含** release 签名密钥（*.jks），这是刻意的安全设计。
# 每次构建会尝试产出两类包：
#
#   · debug   —— 始终产出（用于验证代码可编译）
#   · release —— 仅当检测到签名密钥时产出（正式签名，可覆盖安装）
#
# 若未配置签名密钥，release 包无法安装（未签名），此时只出 debug 包，
# Release 页面会给出说明。配置方法见文件末尾「进阶：配置正式签名」。
# ─────────────────────────────────────────────────────────────

name: Build & Release APK

on:
  push:
    branches: [ master ]
    # 只改文档/资源时不构建。
    # 为什么需要：每次 push 都会编译，而 tag 是 v{versionName}-build{versionCode}，
    # 版本号没变时 softprops/action-gh-release 会**复用已存在的 tag**，
    # 新APK 被追加进同一个 Release 页面 —— 于是「只改了 README」也会
    # 在build32 页面多出两个包，且它们与页面快照的源码对应关系变得混乱。
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - 'tools/**'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  # 允许手动触发：Actions 页面右上角 "Run workflow"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签（留空则自动用 v版本号，例如 v1.11.2）'
        required: false
        type: string

# 同一分支连续提交时，取消过时的构建，避免浪费算力。
#
# v1.12.1：cancel-in-progress 改为 false。
#
# 【为什么必须关掉】
# 这个项目每次提交都触发**完整构建 + 发布 Release**（8~12 分钟），
# 而排查编译错误时往往要连续推送好几次。
# 开着 true 时，后一次推送会**掐断**前一次正在跑的构建，
# 被掐断的 job 同样标记为 failure，而且**日志里一条 annotation 都留不下**
# （脚本没走完，诊断代码根本没执行到）。
#
# 实测踩过：build37 连续两次「编译失败 + 零 annotation」，
# 看运行时长才发现两次都只跑了 1 分 18 秒 —— 根本不是编译失败，是被取消的。
# 这种假失败会把人引向错误的排查方向（以为是代码问题），代价很高。
#
# 现在改为排队串行执行：连续推送会依次构建，
# 代价是慢一点，但每次都能拿到完整的、可信的构建结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 打包完成后自动创建/更新 Release 所需的权限
permissions:
  contents: write

jobs:
  build:
    name: 编译并发布 APK
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
      # 注意：secrets 上下文不可用于 if: 条件判断，只能通过 env 间接使用
      RELEASE_JKS_BASE64: ${{ secrets.RELEASE_JKS_BASE64 }}
      STORE_PWD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      KEY_PWD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整历史，用于取短commit hash 命名

      # JDK 17 —— 必须与 app/build.gradle.kts 中 JavaVersion.VERSION_17 一致
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 可选：配置正式签名（详见文件末尾说明）────────────────────
      # 若已在 Settings → Secrets 配置了 RELEASE_JKS_BASE64 等 4 个变量，
      # 本步骤会自动生效；否则跳过并退回 debug 签名。
      - name: 还原签名密钥（可选）
        if: ${{ env.RELEASE_JKS_BASE64 != '' && env.STORE_PWD != '' }}
        run: |
          echo "$RELEASE_JKS_BASE64" | base64 -d > autolyrics-release.p12
          echo "::notice::签名密钥已还原，将构建正式签名 APK"
      # ────────────────────────────────────────────────────────

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      # v1.12.1：编译前的环境自检。
      #
      # 【为什么需要这一步】
      # 连续两次构建都出现「编译步骤失败、且零 annotation」的反常组合：
      # 连「Gradle 失败（退出码 …）」这条都打不出来，说明脚本在中途被**掐断**，
      # 而非自己走完的。当时的判据是运行时长：
      #   · 两次都只跑了 1 分 18 秒 / 1 分 19 秒
      #   · 而正常构建需要 8~12 分钟
      # 前置步骤（检出/JDK/Gradle 配置/缓存）全部 success，runner 也正常分配，
      # 说明是编译真正开始后被外部终止。
      #
      # 单独加一个步骤打点，好处是**它自己就是一个 annotation**：
      # 如果这个步骤的 annotation 出现了、而编译步骤的没有，
      # 就能立刻确认「是被掐断」而不是「编译报错」。
      - name: 编译前自检
        run: |
          echo "::notice::自检通过：Java $(java -version 2>&1 | head -1)"
          echo "::notice::Gradle wrapper: $(grep distributionUrl gradle/wrapper/gradle-wrapper.properties)"
          echo "::notice::gradlew 可执行: $([ -x gradlew ] && echo yes || echo no)"
          echo "::notice::磁盘可用: $(df -h . | tail -1 | awk '{print $4}')"
          echo "::notice::源码文件数: $(find app/src -name '*.kt' | wc -l)"
          echo "::notice::build37 诊断点已到达，说明脚本能正常执行到编译步骤"

      # 有签名密钥就构建 release 版，否则退回 debug 版
      # 每次构建同时产出 debug 与 release 两个包：
      #   debug   —— 始终产出，用于快速验证代码能否编译
      #   release —— 有签名密钥时产出正式签名包；无密钥时产出的 APK 未签名，
      #              不适合安装，故此时仅构建 debug
      - name: 编译 APK（debug + release）
        id: build
        run: |
          # v1.12.1：显式关闭 errexit。
          #
          # 【为什么必须写这一行】
          # GitHub Actions 默认给 run 块套 `bash -e`。
          # 在 `-e` 下，**任何一条命令返回非 0 都会立刻终止整个脚本** ——
          # 包括看起来无害的命令（比如后面诊断块里的 `grep` 没匹配到会返回 1，
          # 或者 `wc -l < 文件` 在文件不存在时返回 1）。
          # 一旦提前退出，后面所有的 `::error::` 诊断代码统统执行不到，
          # 外部看到的就是「失败 + 零annotation」——
          # 这正是连续 5 次构建查不到原因的原因。
          #
          # 关掉之后由脚本末尾的 `exit $RC` 显式决定成败，
          # 这样**无论中途哪一步出问题，都一定能走到诊断并留下痕迹**。
          set +e

          echo "::notice::编译步骤开始（commit $(git rev-parse --short HEAD 2>/dev/null || echo unknown)）"

          SIGN_AVAILABLE=0
          if [ -f autolyrics-release.p12 ] && [ -n "$STORE_PWD" ]; then
            SIGN_AVAILABLE=1
          fi

          # v1.12.1：把编译输出同时写进 build-log.txt。
          #
          # 为什么要多这一份文件：GitHub 的 Actions 日志页面**必须登录才能看**，
          # 匿名（未登录）访问只能拿到 "Sign in to view logs"，
          # 于是编译失败时外部完全看不到是哪一行报错，只能反复猜。
          # 而 artifact 是可以匿名下载的 —— 把日志做成 artifact，
          # 等于给编译错误开一个不需要登录的出口。
          #
          # 注意这里**不用 set -e**：目的是无论成败都执行到下一步，
          # 由下一行显式判断退出码并 exit，这样上传日志的步骤才会被触发。
          #
          # 【关于中间这几行诊断 —— 三次连续踩坑换来的】
          # 三次失败都是「编译步骤failure + 零 ::error:: annotation」，
          # 但它前面的「编译前自检」步骤（纯 echo）能success。
          # 纯 echo 能过、真正的构建却一个字都吐不出来，
          # 唯一解释是**shell 在 ./gradlew 执行期间被外部终止**，
          # 脚本根本没走到下面的诊断代码。
          #
          # ./gradlew 首次运行要先下载 Gradle 发行版（约 130MB），
          # 三次失败的运行时长分别是 1:18 / 1:18 / 0:54，
          # 都在下载或启动阶段就结束，特征吻合。
          #
          # 所以在启动前后各打一个标记，并且用 tee 让日志**边跑边落盘**
          #（tee 本来就是实时的，但显式记录行数能在被掐断时
          #  从 build-log.txt 尾部看出停在哪一步）。
          echo "::group::构建 debug APK"
          echo ">>> 即将启动 Gradle（首次运行会下载约 130MB 发行版）"
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
          DEBUG_RC=${PIPESTATUS[0]}
          # 128+N 表示被信号 N 杀死（N=9 即 SIGKILL，典型是 OOM killer）。
          # 把这个信息打出来，就能区分「编译报错」和「进程被杀」。
          echo ">>> Gradle 已退出：DEBUG_RC=$DEBUG_RC（130~139 表示被信号杀死，137=SIGKILL 通常是内存不足）"
          echo ">>> build-log.txt 行数=$(wc -l < build-log.txt 2>/dev/null || echo 0)"
          echo "::endgroup::"

          RC=$DEBUG_RC

          if [ "$SIGN_AVAILABLE" = "1" ] && [ "$DEBUG_RC" -eq 0 ]; then
            echo "::group::构建 release APK（正式签名）"
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -PRELEASE_STORE_PASSWORD="$STORE_PWD" \
              -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PWD" 2>&1 | tee -a build-log.txt
            REL_RC=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$REL_RC" -ne 0 ] && RC=$REL_RC
          elif [ "$SIGN_AVAILABLE" = "0" ]; then
            echo "::notice::未配置签名密钥，跳过 release 构建（release 包无签名无法安装）"
          fi

          # 把失败原因输出成 annotation。
          #
          # 【为什么非要这么做】
          # GitHub 的 Actions 日志页面**必须登录**才能看，匿名只能拿到
          # "Sign in to view logs"；artifact 下载同样要鉴权（实测 401）。
          # **annotation 是唯一不登录也能读到的出口**。
          #
          # 【五次踩坑换来的关键约束】
          # GitHub **每个 step 只保留约 10 条 annotation**，超出直接丢弃。
          # 所以「把日志全量倒出来」是错的 —— 只会留下最前面 10 行，
          # 而那恰好是无信息量的栈帧。必须**精准挑选少量高信息量的行**。
          #
          #  1. grep '^e: '      → 无匹配，才知不是 Kotlin 编译错误
          #  2. tail -n 80      → 全是 org.gradle 栈帧，病灶被截掉
          #  3. head -n 45      → 只拿到日志开头，失败摘要在中段
          #  4. split -b + fold → 分块内容全空
          #  5. 倒 100 行        → 超配额，只剩前 10 行（还是栈帧）
          if [ "$RC" -ne 0 ]; then
            # v1.12.1 补：先报日志规模。
            #
            # 【为什么要加这一条】
            # build37 出现过一次「编译失败但一条 annotation 都没有」的反常情况：
            # 既没有 Gradle 的错误摘要，也没有 Kotlin 的 `e:` 行，
            # 连「一条都没匹配到」的兜底分支都没触发。
            # 兜底分支不触发只有一个可能：**build-log.txt 是空的**，
            # 也就是 Gradle 在吐出任何内容之前就死了
            # （Runner 环境问题、gradlew 本身损坏、磁盘满、JDK 异常等）。
            # 先把「日志有多少行、有多大」报出来，
            # 才能把「没内容」和「内容没匹配上」这两种情况区分开。
            LOG_LINES=$(wc -l < build-log.txt 2>/dev/null || echo 0)
            LOG_BYTES=$(wc -c < build-log.txt 2>/dev/null || echo 0)
            echo "::error::Gradle 失败（退出码 $RC）；build-log.txt 共 ${LOG_LINES} 行 / ${LOG_BYTES} 字节"

            # 先滤掉栈帧 —— 占配额却零信息量
            grep -vE '^[[:space:]]+at (org\.gradle|java\.|jdk\.|sun\.|kotlin\.|com\.android|worker\.org)' \
              build-log.txt > diag.txt || true

            # 按信息密度挑选，控制在 7 条以内（连同上面那条共 8 条，
            # 给 GitHub 的 10 条配额留余量）。
            # 优先：Gradle 失败摘要 / 因果链 / 任务失败 / Kotlin 错误 / OOM 等。
            grep -E '^\* What went wrong:|^Caused by:|^> Task .*(FAILED|failed)|^e: |Execution failed for task|^FAILURE:|^\* Exception is:|OutOfMemory|Unsupported class file|no signature|Could not (resolve|download|find)' \
              diag.txt | head -n 7 > diag-picked.txt || true

            # 一条都没匹配到 → 兜底给最后 4 条非空非栈帧行
            if [ ! -s diag-picked.txt ]; then
              echo "===== 未匹配到已知错误模式，以下是最后 4 条非栈帧行 =====" > diag-picked.txt
              grep -v '^[[:space:]]*$' diag.txt | tail -n 4 >> diag-picked.txt
            fi

            while IFS= read -r line || [ -n "$line" ]; do
              echo "::error::$line"
            done < diag-picked.txt

            # 【硬兜底：把 build-log.txt 的原始尾部直接用 error 打出来】
            #
            # 前面那套 grep 精准挑选已经连续 4 次什么都没打出来，
            # 说明黑名单没覆盖真实的错误格式。
            # 与其继续猜模式，不如放弃挑选 —— **Kotlin 的 `e:` 行有固定前缀**，
            # 只要它在日志里，就一定能被 `^e: ` 抓到；
            # 抓不到就说明它根本不在build-log.txt 里（被掐断/写到别处）。
            #
            # 这里刻意用 `grep -n` 带行号，因为 annotation 会把长行截断，
            # 有了行号才能回头按行号定位原文。
            # 同时排除空行和纯进度字符，避免白白占用 10 条配额。
            echo "::error::==== build-log.txt 原始尾部（带行号，用于定位）===="
            grep -nvE '^[[:space:]]*$|^Download |^Starting |^Welcome to|Gradle user home' \
              build-log.txt | tail -n 4 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

          echo "has_signed_release=${SIGN_AVAILABLE}" >> "$GITHUB_OUTPUT"

          # 最后一道打点：能执行到这里，说明脚本**完整跑完**了。
          # 如果这条 notice 没出现，就是脚本在中途被终止。
          echo "::notice::编译步骤脚本完整执行完毕，RC=$RC，即将退出"

          exit $RC

      # v1.12.1：**无论编译成功还是失败都上传日志**。
      #
      # if: always() 是关键 —— 编译失败时后续步骤默认被跳过，
      # 但这正是最需要日志的时刻。
      # artifact 可匿名下载，绕开了「Actions 日志必须登录」的限制。
      - name: 上传编译日志（失败时也能下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          retention-days: 30
          if-no-files-found: ignore

      # 命名规则对齐参考项目：AutoLyrics-1.11.2-abc1234-debug.apk
      - name: 收集并重命名 APK
        id: artifact
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          BUILD_NO=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)

          # tag 形如 v1.11.2-build25：版本名 + Android versionCode。
          # versionCode 由 Android 系统要求单调递增，天然唯一，
          # 因此每次改大它就会得到一个全新的 tag，旧版本完整保留。
          if [ -z "$BUILD_NO" ]; then
            echo "::error::未能从 build.gradle.kts 读到 versionCode"
            exit 1
          fi
          TAG="v${VERSION}-build${BUILD_NO}"

          # 收集所有产出的 APK，统一改名后放进 dist/
          mkdir -p dist
          COLLECTED=""

          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "dist/AutoLyrics-${VERSION}-build${BUILD_NO}-${SHORT_SHA}-debug.apk"
            COLLECTED="dist/AutoLyrics-${VERSION}-build${BUILD_NO}-${SHORT_SHA}-debug.apk"
          fi

          if [ "${{ steps.build.outputs.has_signed_release }}" = "1" ]; then
            REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | grep -v "unsigned" | head -1)
            if [ -n "$REL_APK" ]; then
              cp "$REL_APK" "dist/AutoLyrics-${VERSION}-build${BUILD_NO}-${SHORT_SHA}-release.apk"
              COLLECTED="${COLLECTED} dist/AutoLyrics-${VERSION}-build${BUILD_NO}-${SHORT_SHA}-release.apk"
            fi
          fi

          # 注意：softprops/action-gh-release 的 files 参数要求**逗号分隔**，
          # 不能用空格分隔（空格会导致资产静默丢失，Release 页面为空）。
          COLLECTED=$(echo "$COLLECTED" | xargs | sed 's/ /,/g')
          if [ -z "$COLLECTED" ]; then
            echo "::error::未找到任何 APK 文件，构建失败"
            exit 1
          fi

          echo "version=${VERSION}"       >> "$GITHUB_OUTPUT"
          echo "build_no=${BUILD_NO}"    >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"              >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}"        >> "$GITHUB_OUTPUT"
          echo "apks=${COLLECTED}"       >> "$GITHUB_OUTPUT"
          echo "signed=${{ steps.build.outputs.has_signed_release }}" >> "$GITHUB_OUTPUT"

          echo "::notice::产物："
          ls -lh dist/
          echo "::notice::tag = $TAG"
          echo "::notice::传给 Release 的 files = $COLLECTED"

      - name: 上传构建产物（Actions 页面备份）
        uses: actions/upload-artifact@v4
        with:
          name: AutoLyrics-${{ steps.artifact.outputs.version }}-${{ steps.artifact.outputs.sha }}
          path: dist/*.apk
          retention-days: 90

      # 从 CHANGELOG.md 抽出本次版本的更新日志。
      #
      # 【为什么不用 generate_release_notes】
      # 那个开关生成的是 GitHub 自动比对 commit 写出来的流水账，
      # 内容是「更新了 A.kt」「修复了 B.kt」这种对普通用户没意义的记录，
      # 而且它跟版本对不上（会把合并进来的所有提交都算上）。
      # 我们要的是**面向使用者**的「这个版本修了什么、改了什么」，
      # 所以改为人工维护 CHANGELOG.md，按版本分段。
      #
      # 【抽取规则】
      # 段标题格式固定为 `## v{版本名} · build{构建号}`，
      # 抽取「命中标题那一行」到「下一个 ## 行之前」的内容。
      # 用 awk 而不是 grep -A：段落里可能有空行和二级标题，
      # 变量行数无法事先知道。
      #
      # 【找不到时的行为】
      # 不报错、只给一行提示。理由：CHANGELOG 漏写是文档问题，
      # 不应该让整个发布流程失败、卡住用户的下载。
      # 但会用 ::warning:: 在日志里明确提示，避免「悄悄发了个没日志的版本」。
      - name: 抽取更新日志
        id: changelog
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          BUILD_NO: ${{ steps.artifact.outputs.build_no }}
        run: |
          set -e
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            # 排除两种情况：下一个二级标题（段落结束）、水平分隔线（段落之间的视觉分隔，不属于内容）。
            #
            # 最后一段 awk 只做一件事：**去掉末尾的空行**（记录最后一个非空行的下标，正序打印到那里为止）。
            # 中间的空行必须保留——Markdown 用空行分隔段落，删掉会让列表和标题粘成一坨。
            # 注意必须正序打印；曾经误写成倒序，结果整个段落顺序颠倒。
            NOTES=$(awk -v want="## v${VERSION} · build${BUILD_NO}" '
              $0 == want { found = 1; next }
              found && (/^## / || /^---[[:space:]]*$/) { exit }
              found { print }
            ' CHANGELOG.md | sed -e 's/[[:space:]]*$//' | awk '
              { line[n++] = $0 }
              END {
                last = -1
                for (i = 0; i < n; i++) if (line[i] != "") last = i
                for (i = 0; i <= last; i++) print line[i]
              }
            ')
          fi

          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::warning::CHANGELOG.md 里没有 \`## v${VERSION} · build${BUILD_NO}\` 段落，本次 Release 将不显示更新日志。请在 CHANGELOG.md 顶部补一条。"
            NOTES="_本次发布未在 CHANGELOG.md 中记录改动。_"
          fi

          # 写入 GITHUB_OUTPUT 供后续 Release 步骤引用
          {
            echo 'notes<<CHANGELOG_EOF'
            echo "$NOTES"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

          echo "::notice::已抽取 build${BUILD_NO} 的更新日志，共 $(echo "$NOTES" | wc -l) 行"

      # 创建 / 更新 Release，APK 挂在页面上
      #
      # 【保留历史版本的设计】
      # tag 形如 v1.11.2-build25（版本名 + Android versionCode），
      # 因此每次 versionCode 递增都会生成**全新的 tag 与 Release**，
      # 旧版本的 APK 天然被保留，不做任何清理动作。
      #
      # 为什么这样设计：
      #   · 能回溯任意历史构建，随时下载旧版本排查问题
      #   · 每个 tag 只对应一次提交，Source code 快照与 APK 永远一致
      #     （无需再「校准 tag 指向」——那步会覆盖历史，正是我们要避免的）
      #   · versionCode 是 Android 的单调递增整数，天然唯一且可比较，
      #     比时间戳更适合当构建号
      #
      # prerelease 设为 false：这些是正式发布的构建。
      # 每次 versionCode 递增都会产生全新 tag，因此不需要靠 pre-release
      # 来区分新旧——历史版本各自独立，Latest 天然落在最新的那个上。
      - name: 创建或更新 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 手动触发可指定 tag；默认用「v版本名-build版本号」，保证每次都是新 tag
          tag_name: ${{ github.event.inputs.release_tag || steps.artifact.outputs.tag }}
          name: AutoLyrics ${{ steps.artifact.outputs.version }} (build ${{ steps.artifact.outputs.build_no }})
          draft: false
          prerelease: false
          files: ${{ steps.artifact.outputs.apks }}
          # 不用 generate_release_notes：它生成的是 commit 流水账，
          # 我们要的是人工维护的、面向使用者的更新日志（见上面「抽取更新日志」步骤）。
          generate_release_notes: false
          body: |
            ## AutoLyrics ${{ steps.artifact.outputs.version }} · build ${{ steps.artifact.outputs.build_no }}

            安卓自动歌词应用 —— 悬浮窗 / 通知栏 / App 内实时逐字高亮。

            | 项 | 值 |
            | --- | --- |
            | 版本 | `${{ steps.artifact.outputs.version }}` |
            | 构建号 | `${{ steps.artifact.outputs.build_no }}` |
            | Commit | `${{ steps.artifact.outputs.sha }}` |
            | 最低系统 | Android 8.0 (API 26) |
            | 架构 | 通用（无 native 库，全平台可装） |

            ### 本次更新

            ${{ steps.changelog.outputs.notes }}

            ### 选哪个包

            | 包 | 用途 | 覆盖安装 |
            | --- | --- | --- |
            | `*-release.apk` | **日常使用推荐** | ✅ 可直接升级 |
            | `*-debug.apk` | 排查问题用，含调试符号 | ❌ 与正式版签名不同 |

            > 全部为预发布（pre-release）。历史版本都保留着，往下翻可找到任意旧构建。

            ### 选择哪个包

            ${{ steps.artifact.outputs.signed == '1' && '| 包 | 用途 | 覆盖安装 |' || '| 包 | 用途 | 覆盖安装 |' }}
            ${{ steps.artifact.outputs.signed == '1' && '| --- | --- | --- |' || '| --- | --- | --- |' }}
            ${{ steps.artifact.outputs.signed == '1' && '| `*-release.apk` | **日常使用推荐** | ✅ 可直接升级 |' || '' }}
            ${{ steps.artifact.outputs.signed == '1' && '| `*-debug.apk` | 排查问题用，含调试符号 | ❌ 与正式版签名不同 |' || '' }}

            ${{ steps.artifact.outputs.signed != '1' && '>⚠️ 当前仅提供 **debug 调试签名**包。与线上正式版签名不同，**覆盖安装前需先卸载旧版**（会清除本地设置）。' || '> 两个包功能完全一致，日常使用请选 `release` 包。' }}

            ### 安装说明
            1. 下载上方 Assets 里的 `AutoLyrics-${{ steps.artifact.outputs.version }}-build${{ steps.artifact.outputs.build_no }}-*.apk`
            2. 传到手机点击安装（需允许「安装未知来源应用」）
            3. 首次启动后按App 内引导开启三个权限：
               **通知读取** / **悬浮窗** / **通知权限**

      # 发布后自检：确认 APK 真的挂到了 Release 上。
      # softprops 在 assets 上传失败时可能只打 warning 而不 fail，
      # 导致 job 显示 success 但 Release 页面空无一物。
      - name: 验证 Release 资产已就位
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.release_tag || steps.artifact.outputs.tag }}
        run: |
          set -e
          echo "等待 GitHub 完成资产处理…"
          COUNT=0
          for i in $(seq 1 12); do
            N=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets | length' 2>/dev/null || echo 0)
            [ "$N" -gt 0 ] && break
            sleep 5
            COUNT=$((COUNT+1))
          done

          FINAL=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "$FINAL" -eq 0 ]; then
            echo "::error::Release $TAG 上没有任何 APK 资产，上传失败"
            exit 1
          fi

          echo "::notice::Release 资产数 = $FINAL"
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | "  ✓ \(.name)  (\(.size/1048576*100|floor/100)) MB"'

# ═══════════════════════════════════════════════════════════════
# 【进阶：配置正式签名，让 Actions 产出可覆盖安装的 APK】
#
#   1. 仓库网页 → Settings → Secrets and variables → Actions → New repository secret
#   2. 依次添加 4 个 Secret：
#        RELEASE_JKS_BASE64     ← jks 文件的 Base64 编码
#        RELEASE_STORE_PASSWORD
#        RELEASE_KEY_ALIAS
#        RELEASE_KEY_PASSWORD
#
#   3. 完成！无需再改本文件——「还原签名密钥」步骤会自动检测
#      RELEASE_JKS_BASE64 与 RELEASE_STORE_PASSWORD 是否存在：
#        · 存在 → 自动构建 release 签名 APK，Release 标题与说明标为release
#        · 不存在 → 退回 debug 签名，构建不中断
#
# 生成 Base64（Windows PowerShell 单行）：
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes('autolyrics-release.p12')) | Out-File -Encoding ascii jks.b64
#   Get-Content jks.b64
#
# ⚠️ Secrets 不会显示在网页、日志或 git 历史中，但仅用于自己信任的仓库。
#    本项目是自用签名、不上架应用商店，debug 签名已足够日常使用。
# ═══════════════════════════════════════════════════════════════